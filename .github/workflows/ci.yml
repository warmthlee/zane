name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DOTNET_VERSION: '10.0.x'

jobs:
  frontend:
    name: 前端构建与检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore src-dotnet/Zane.sln
      - run: dotnet build src-dotnet/Zane.sln -c Release --no-restore
      - run: dotnet test src-dotnet/Zane.sln -c Release --no-build

  contract:
    name: OpenAPI 契约一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: npm ci
      - run: npm run api:generate
      # 生成物必须与提交内容一致；不一致说明改了契约却没有提交生成结果。
      - run: git diff --exit-code -- src/api-client

  migration:
    name: 数据库迁移演练
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet restore src-dotnet/Zane.sln
      # 模型改动必须已生成迁移，避免发布时才发现缺迁移。
      - run: dotnet ef migrations has-pending-model-changes --project src-dotnet/Zane.Api
      # 在空库上完整执行迁移，确认迁移链可从头建表。
      - run: >
          dotnet ef database update
          --project src-dotnet/Zane.Api
          --connection "Data Source=/tmp/zane-migration-check.db"
      # SQLite 不支持幂等脚本，以迁移包重复执行验证可重复性。
      - run: >
          dotnet ef database update
          --project src-dotnet/Zane.Api
          --connection "Data Source=/tmp/zane-migration-check.db"

  package:
    name: 后端发布产物
    runs-on: ubuntu-latest
    needs: [frontend, backend, contract, migration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - run: dotnet publish src-dotnet/Zane.Api/Zane.Api.csproj -c Release -o publish/api
      # 自包含迁移包：服务器无需安装 SDK；按迁移历史只应用待执行迁移。
      - run: >
          dotnet ef migrations bundle
          --project src-dotnet/Zane.Api
          --configuration Release
          --self-contained -r linux-x64
          -o publish/api/efbundle
      - run: test -x publish/api/efbundle
      - uses: actions/upload-artifact@v4
        with:
          name: zane-api
          path: publish/api
          retention-days: 14
